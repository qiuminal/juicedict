name: JuiceDict v0.1.2 Release

on:
  schedule:
    # 04:00 UTC = 12:00 Asia/Shanghai. GitHub may start scheduled jobs late.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: juicedict-v0.1.2-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.JUICEDICT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Run tests and build release APK
        env:
          JUICEDICT_STORE_FILE: ${{ runner.temp }}/release.keystore
          JUICEDICT_STORE_PASSWORD: ${{ secrets.JUICEDICT_STORE_PASSWORD }}
          JUICEDICT_KEY_ALIAS: ${{ secrets.JUICEDICT_KEY_ALIAS }}
          JUICEDICT_KEY_PASSWORD: ${{ secrets.JUICEDICT_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify APK metadata and historical signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$APK"
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='5' versionName='0.1.2'"
          EXPECTED_CERT="00173116DD7CDC1F6BC192BC876335F379EA387CDCD59222FE758F9F1D2986D0"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 | sed -n 's/.*SHA-256 digest: //p' | tr -d '\r' | tr '[:lower:]' '[:upper:]')
          test "$CERT" = "$EXPECTED_CERT"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Create v0.1.2 GitHub Release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.2 already exists; scheduled run is a no-op."
            exit 0
          fi
          gh release create v0.1.2 \
            app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v0.1.2" \
            --notes-file release-notes/v0.1.2.md \
            --latest

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
