name: JuiceDict v0.1.4 Release

on:
  # 版本发布完成后必须移除定时触发器：残留的 cron 会让仓库每天空跑 CI。
  # 当前仅保留手动入口，需要发布时用 workflow_dispatch 触发。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: juicedict-v0.1.4-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # ubuntu-latest runner 已预装 Android SDK（含 build-tools 35.0.0）。
        # 不再使用 android-actions/setup-android：该 Action 会尝试安装已被
        # Android 仓库移除的 'tools' 包，导致 sdkmanager 以 exit 1 失败
        # （Failed to find package 'tools'）。这里只显式导出 SDK 路径。
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK/build-tools/35.0.0"
          test -d "$SDK/platforms/android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.JUICEDICT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Run tests and build release APK
        env:
          JUICEDICT_STORE_FILE: ${{ runner.temp }}/release.keystore
          JUICEDICT_STORE_PASSWORD: ${{ secrets.JUICEDICT_STORE_PASSWORD }}
          JUICEDICT_KEY_ALIAS: ${{ secrets.JUICEDICT_KEY_ALIAS }}
          JUICEDICT_KEY_PASSWORD: ${{ secrets.JUICEDICT_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify APK metadata and historical signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$APK"
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='7' versionName='0.1.4'"
          EXPECTED_CERT="00173116DD7CDC1F6BC192BC876335F379EA387CDCD59222FE758F9F1D2986D0"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 | sed -n 's/.*SHA-256 digest: //p' | tr -d '\r' | tr '[:lower:]' '[:upper:]')
          test "$CERT" = "$EXPECTED_CERT"
          # 附件对外统一使用带版本号的文件名，与 v0.1.0 / v0.0.x 的历史命名保持一致。
          cp "$APK" "JuiceDict-v0.1.4-release.apk"
          sha256sum JuiceDict-v0.1.4-release.apk | tee apk-sha256.txt

      - name: Create v0.1.4 GitHub Release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.4 already exists; run is a no-op."
            exit 0
          fi
          gh release create v0.1.4 \
            JuiceDict-v0.1.4-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v0.1.4" \
            --notes-file release-notes/v0.1.4.md \
            --latest

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
